<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Phone MIDI</title>
<style>
  :root { --bg: #0e0f12; --card: #181a1f; --field: #22252c; --fg: #eceef2; --dim: #8a8f99;
          --accent: #9ebef3; --line: #2a2d35; --err: #f39e9e; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); min-height: 100dvh;
         display: flex; flex-direction: column; gap: 12px; background: var(--bg); color: var(--fg);
         font: 15px system-ui, -apple-system, sans-serif; -webkit-user-select: none; user-select: none;
         -webkit-tap-highlight-color: transparent; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  summary { font-weight: 600; cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "settings ▾"; color: var(--dim); font-weight: 400; font-size: 13px; }
  details[open] summary::after { content: "▴"; }
  label { display: block; color: var(--dim); font-size: 12px; margin: 10px 0 4px; }
  input:not([type]), input[type=password], input[type=number] {
    width: 100%; padding: 10px; font: inherit; background: var(--field); color: var(--fg);
    border: 1px solid var(--line); border-radius: 8px; outline: none; }
  input:focus { border-color: var(--accent); }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 12px; color: var(--fg); font-size: 14px; }
  .check input { accent-color: var(--accent); width: 18px; height: 18px; }
  button { width: 100%; margin-top: 14px; padding: 13px; font: inherit; font-weight: 600;
           background: var(--accent); color: #0e0f12; border: 0; border-radius: 10px; }
  button:active { opacity: 0.8; }
  #status { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 13px; }
  #status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  #status.ok::before { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  #status.err { color: var(--err); }
  #status.err::before { background: var(--err); }
  .meters { display: flex; flex-direction: column; gap: 12px; }
  .meter span { display: flex; justify-content: space-between; font-size: 13px; color: var(--dim); margin-bottom: 6px; }
  .meter b { color: var(--fg); font-variant-numeric: tabular-nums; }
  .bar { height: 10px; background: var(--field); border-radius: 5px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 5px;
           transition: width 60ms linear; }
  #pad { flex: 1; min-height: 100px; border: 1.5px solid var(--accent); border-radius: 16px;
         background: rgba(158, 190, 243, 0.06); display: flex; align-items: center; justify-content: center;
         color: var(--accent); font-weight: 600; letter-spacing: 0.02em; touch-action: none; }
  #pad.on { background: var(--accent); color: #0e0f12; }
  #slider { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; margin: 0;
            background: transparent; touch-action: none; --p: 0%; }
  #slider::-webkit-slider-runnable-track { height: 16px; border-radius: 8px;
    background: linear-gradient(to right, var(--accent) var(--p), var(--field) var(--p)); }
  #slider::-moz-range-track { height: 16px; border-radius: 8px; background: var(--field); }
  #slider::-moz-range-progress { height: 16px; border-radius: 8px; background: var(--accent); }
  #slider::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; margin-top: -7px;
    border-radius: 50%; background: var(--fg); border: 3px solid var(--accent); }
  #slider::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: var(--fg);
    border: 3px solid var(--accent); }
</style>
</head>
<body>
<details id="settings" class="card" open>
  <summary>Phone → MQTT → MIDI</summary>
  <label>Broker URL</label>
  <input id="url" value="wss://public.cloud.shiftr.io">
  <div class="row">
    <div><label>Username</label><input id="username" value="public"></div>
    <div><label>Password</label><input id="password" type="password" value="public"></div>
  </div>
  <div class="row">
    <div><label>Prefix</label><input id="prefix" value="remote"></div>
    <div><label>MIDI channel</label><input id="channel" type="number" min="1" max="16" value="1"></div>
  </div>
  <label class="check"><input id="echo" type="checkbox"> Echo notes (latency test)</label>
  <button id="connect">Connect</button>
</details>
<div id="status">disconnected</div>

<div class="card meters">
  <div class="meter"><span>CC 1 · pitch <b id="v1">–</b></span><div class="bar"><i id="b1"></i></div></div>
  <div class="meter"><span>CC 2 · roll <b id="v2">–</b></span><div class="bar"><i id="b2"></i></div></div>
  <div class="meter"><span>CC 3 · yaw <b id="v3">–</b></span><div class="bar"><i id="b3"></i></div></div>
</div>
<div id="pad">hold · note 60</div>
<div class="card">
  <div class="meter"><span>CC 4 · slider <b id="v4">–</b></span></div>
  <input id="slider" type="range" min="0" max="127" value="0">
</div>

<script type="module">
import { MqttMidi } from "https://esm.sh/@grantler-instruments/mqtt-midi@0.1.0?deps=mqtt@5.16.0";

const SEND_INTERVAL_MS = 33;
const FIELDS = ["url", "username", "password", "prefix", "channel"];
const CCS = [1, 2, 3, 4];
const $ = (id) => document.getElementById(id);

let midi = null;
const current = { 1: null, 2: null, 3: null, 4: null };
const sent = { 1: null, 2: null, 3: null, 4: null };

function loadSettings() {
  for (const f of FIELDS) {
    try {
      const v = localStorage.getItem("phone-midi-" + f);
      if (v !== null) $(f).value = v;
    } catch {}
  }
}

function saveSettings() {
  for (const f of FIELDS) {
    try { localStorage.setItem("phone-midi-" + f, $(f).value); } catch {}
  }
}

function setStatus(text, state = "") {
  $("status").textContent = text;
  $("status").className = state;
}

function toCC(value, min, max) {
  const t = (Math.min(Math.max(value, min), max) - min) / (max - min);
  return Math.round(t * 127);
}

function channel() {
  return Math.min(Math.max(parseInt($("channel").value, 10) || 1, 1), 16);
}

function show(cc, value) {
  $("v" + cc).textContent = value;
  const bar = $("b" + cc);
  if (bar) bar.style.width = (value / 127 * 100) + "%";
}

// beta = pitch (front/back), gamma = roll (left/right), alpha = yaw (rotation around the screen axis, wraps 360 -> 0).
function onOrientation(e) {
  if (e.beta === null) return;
  current[1] = toCC(e.beta, -90, 90);
  current[2] = toCC(e.gamma, -90, 90);
  current[3] = toCC(e.alpha ?? 0, 0, 360);
}

function sendChanged() {
  for (const cc of CCS) {
    const v = current[cc];
    if (v === null || v === sent[cc]) continue;
    sent[cc] = v;
    show(cc, v);
    if (midi) midi.sendControlChange(channel(), cc, v);
  }
}

async function requestMotion() {
  const DOE = window.DeviceOrientationEvent;
  if (!DOE) return setStatus("no orientation sensor in this browser", "err");
  if (typeof DOE.requestPermission === "function") {
    const result = await DOE.requestPermission();
    if (result !== "granted") return setStatus("motion permission denied", "err");
  }
  window.addEventListener("deviceorientation", onOrientation);
}

async function keepAwake() {
  try { await navigator.wakeLock?.request("screen"); } catch {}
}

// Sends notes arriving on {prefix}/out back to {prefix}/in, so the computer can time the round trip.
function listenForEcho() {
  midi.on("noteOn", ({ channel, note, velocity }) => {
    if ($("echo").checked) midi.sendNoteOn(channel, note, velocity);
  });
  midi.on("noteOff", ({ channel, note }) => {
    if ($("echo").checked) midi.sendNoteOff(channel, note);
  });
}

async function connect() {
  saveSettings();
  // iOS only grants motion permission when asked directly inside the tap handler, before any other await.
  await requestMotion();
  if (midi) await midi.disconnect();
  setStatus("connecting…");
  midi = new MqttMidi({
    url: $("url").value.trim(),
    prefix: $("prefix").value.trim(),
    mqttOptions: {
      username: $("username").value || undefined,
      password: $("password").value || undefined,
    },
  });
  midi.on("connect", () => setStatus("connected · prefix " + $("prefix").value.trim(), "ok"));
  midi.on("disconnect", () => setStatus("disconnected"));
  midi.on("error", (err) => setStatus("error: " + err.message, "err"));
  listenForEcho();
  try {
    await midi.connect();
    $("settings").open = false;
    keepAwake();
  } catch (err) {
    setStatus("error: " + err.message, "err");
  }
}

function padDown(e) {
  e.preventDefault();
  $("pad").classList.add("on");
  if (midi) midi.sendNoteOn(channel(), 60, 100);
}

function padUp(e) {
  e.preventDefault();
  if (!$("pad").classList.contains("on")) return;
  $("pad").classList.remove("on");
  if (midi) midi.sendNoteOff(channel(), 60);
}

loadSettings();
$("connect").addEventListener("click", connect);
$("pad").addEventListener("pointerdown", padDown);
$("pad").addEventListener("pointerup", padUp);
$("pad").addEventListener("pointercancel", padUp);
$("pad").addEventListener("pointerleave", padUp);
$("slider").addEventListener("input", () => {
  current[4] = Number($("slider").value);
  $("slider").style.setProperty("--p", (current[4] / 127 * 100) + "%");
});
setInterval(sendChanged, SEND_INTERVAL_MS);
</script>
</body>
</html>
