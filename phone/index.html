<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
<title>mqtt-max phone</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f2f2f0; --surface: #ffffff; --ink: #111111; --dim: #8b8b88; --line: #e3e3df;
    --accent: #ff5a1f; --ok: #22b35e; --err: #e5484d;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --radius: 16px; --radius-inner: 10px;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0b0c; --surface: #161618; --ink: #f2f2f2; --dim: #7c7c82; --line: #26262a; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; background: var(--bg); }
  body {
    max-width: 592px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px;
    padding: calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
    background: var(--bg); color: var(--ink);
    font: 16px -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .label { font: 500 11px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }

  header { display: flex; align-items: center; justify-content: space-between; height: 28px; }
  .mark { font: 600 13px var(--mono); letter-spacing: 0.04em; }
  .mark i { color: var(--accent); font-style: normal; }
  #status { display: flex; align-items: center; gap: 7px; min-width: 0; max-width: 70%; }
  #status span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
  #status.ok { color: var(--ink); }
  #status.ok::before { background: var(--ok); }
  #status.busy::before { background: var(--accent); animation: blink 0.8s steps(2) infinite; }
  #status.err { color: var(--err); }
  #status.err::before { background: var(--err); }
  @keyframes blink { 50% { opacity: 0.2; } }

  #setup-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; color: var(--ink);
               font: inherit; text-align: left; cursor: pointer; transition: background-color 150ms, border-color 150ms; }
  #setup-bar span { line-height: 20px; }
  #setup-bar .icon { font: 400 18px/20px var(--mono); color: var(--dim); transition: transform 150ms; }
  body:not(.setup) #setup-bar { background: var(--ink); border-color: var(--ink); }
  body:not(.setup) #setup-bar span { color: var(--bg); }
  body.setup #setup-bar .icon { transform: rotate(45deg); }
  body.setup .meters, body.setup #padbox, body:not(.setup) #settings, body:not(.setup) #connect { display: none; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .fields .wide { grid-column: 1 / -1; }
  .fields label { display: flex; flex-direction: column; gap: 6px; }
  input:not([type]), input[type=password], input[type=number] {
    width: 100%; padding: 11px 12px; font: 16px var(--mono); color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-inner); outline: none;
    -webkit-user-select: text; user-select: text;
  }
  input:focus { border-color: var(--ink); }
  .switch input { align-self: flex-start; margin-top: 9px !important; }
  .switch input { appearance: none; -webkit-appearance: none; margin: 0; width: 42px; height: 26px; border-radius: 13px;
                  background: var(--line); position: relative; transition: background 150ms; }
  .switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%;
                         background: var(--surface); box-shadow: 0 1px 2px rgb(0 0 0 / 0.25); transition: transform 150ms; }
  .switch input:checked { background: var(--accent); }
  .switch input:checked::after { transform: translateX(16px); }
  #connect { display: flex; align-items: center; justify-content: center; width: 100%; cursor: pointer;
             background: var(--ink); border-color: var(--ink); color: var(--bg);
             font: 600 11px/20px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; }
  #connect.connected { background: var(--accent); border-color: var(--accent); color: #fff; }
  #connect:active, #setup-bar:active { opacity: 0.8; }

  .meters { display: grid; gap: 12px; }
  .meter { display: grid; grid-template-columns: 96px 1fr 52px; align-items: center; gap: 12px; }
  .meter b { font: 500 13px var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
  .bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--ink); transition: width 60ms linear; }

  #yaw { cursor: pointer; }

  #padbox { flex: 1; min-height: 220px; container-type: size; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #pad, #slider { --side: min(100cqw, calc(100cqh - 58px)); width: var(--side); }
  #pad { position: relative; height: var(--side);
         display: flex; flex-direction: column; justify-content: space-between; padding: 14px;
         border-radius: var(--radius); border: 1px solid var(--line); touch-action: none; overflow: hidden;
         background: linear-gradient(var(--dim), var(--dim)) center / 1px 14px no-repeat,
                     linear-gradient(var(--dim), var(--dim)) center / 14px 1px no-repeat, var(--surface);
         transition: background-color 40ms; }
  #pad .xy { font: 500 13px var(--mono); font-variant-numeric: tabular-nums; color: var(--dim); }
  #dot { position: absolute; left: 50%; top: 50%; width: 28px; height: 28px; margin: -14px 0 0 -14px;
         border-radius: 50%; border: 2px solid var(--ink); opacity: 0; pointer-events: none; }
  #pad.touched #dot { opacity: 1; }
  #pad.on { background: var(--accent); border-color: var(--accent); }
  #pad.on .label, #pad.on .xy { color: #fff; }
  #pad.on #dot { border-color: #fff; }
  #slider { flex: none; height: 48px; display: flex; justify-content: space-between; align-items: center; padding: 0 14px;
            border-radius: var(--radius); border: 1px solid var(--line); touch-action: none; cursor: pointer; --p: 0%;
            background: linear-gradient(to right, var(--accent) var(--p), var(--surface) var(--p)); }
  #slider .label { color: var(--ink); }
  #slider b { font: 500 13px var(--mono); font-variant-numeric: tabular-nums; }

  .devices { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-height: 26px; margin-top: 14px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 999px;
          border: 1px solid var(--line); font: 500 11px var(--mono); }
  .chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
  .chip.me { border-color: var(--ink); }
</style>
</head>
<body class="setup">
<header>
  <span class="mark">mqtt<i>·</i>max</span>
  <span id="status" class="label"><span id="status-text">offline</span></span>
</header>

<button id="setup-bar" class="panel" aria-expanded="true" aria-controls="settings">
  <span class="label">Setup</span><span class="icon">+</span>
</button>

<div id="settings" class="panel">
  <div class="fields">
    <label class="wide"><span class="label">Broker</span><input id="url" value="wss://public.cloud.shiftr.io"></label>
    <label><span class="label">User</span><input id="username" value="public"></label>
    <label><span class="label">Password</span><input id="password" type="password" value="public"></label>
    <label><span class="label">Prefix</span><input id="prefix" value="remote"></label>
    <label><span class="label">Name</span><input id="name"></label>
    <label><span class="label">Channel</span><input id="channel" type="number" min="1" max="16" value="1"></label>
    <label class="switch"><span class="label">Echo notes</span><input id="echo" type="checkbox"></label>
  </div>
  <div class="devices" id="devices"><span class="label">Online</span></div>
</div>

<button id="connect" class="panel">Connect</button>

<div class="panel meters">
  <div class="meter"><span class="label">CC1 Pitch</span><div class="bar"><i id="b1"></i></div><b id="v1">–</b></div>
  <div class="meter"><span class="label">CC2 Roll</span><div class="bar"><i id="b2"></i></div><b id="v2">–</b></div>
  <div class="meter" id="yaw" title="Tap to center"><span class="label">CC3 Yaw</span><div class="bar"><i id="b3"></i></div><b id="v3">–</b></div>
  <div class="meter"><span class="label">CC4 Network</span><div class="bar"><i id="bnet"></i></div><b id="vnet">–</b></div>
</div>


<div id="padbox">
  <div id="pad" role="application" aria-label="XY pad: X CC 5, Y CC 6, hold for note 60">
    <span class="label">CC5/6 XY · Hold for note 60</span>
    <span class="xy" id="xy">X – · Y –</span>
    <i id="dot"></i>
  </div>
  <div id="slider" role="slider" aria-label="CC 7" aria-valuemin="0" aria-valuemax="127" aria-valuenow="0">
    <span class="label">CC7 Slider</span><b id="v7">–</b>
  </div>
</div>


<script type="module">
import { MqttMidi } from "https://esm.sh/@grantler-instruments/mqtt-midi@0.1.0?deps=mqtt@5.16.0";

const SEND_INTERVAL_MS = 33;
const FIELDS = ["url", "username", "password", "prefix", "name", "channel"];
const CCS = [1, 2, 3, 4, 5, 6, 7];
const PING_INTERVAL_MS = 500;
const PING_TIMEOUT_MS = 1000;
const RTT_MAX_MS = 500;
const STATUS_OPTIONS = { qos: 1, retain: true };
const $ = (id) => document.getElementById(id);

let midi = null;
const current = { 1: null, 2: null, 3: null, 4: null, 5: null, 6: null, 7: null };
const sent = { 1: null, 2: null, 3: null, 4: null, 5: null, 6: null, 7: null };
let yawOrigin = null;
let pingSent = null;
const online = new Set();

function loadSettings() {
  for (const f of FIELDS) {
    try {
      const v = localStorage.getItem("phone-midi-" + f);
      if (v !== null) $(f).value = v;
    } catch {}
  }
  if (!$("name").value) $("name").value = "phone-" + Math.random().toString(16).slice(2, 6);
}

function saveSettings() {
  for (const f of FIELDS) {
    try { localStorage.setItem("phone-midi-" + f, $(f).value); } catch {}
  }
}

function setStatus(text, state = "") {
  $("status-text").textContent = text;
  $("status").className = "label " + state;
}

const prefix = () => $("prefix").value.trim();
const name = () => $("name").value.trim();
const statusTopic = () => `${prefix()}/status/${name()}`;

function toCC(value, min, max) {
  const t = (Math.min(Math.max(value, min), max) - min) / (max - min);
  return Math.round(t * 127);
}

function channel() {
  return Math.min(Math.max(parseInt($("channel").value, 10) || 1, 1), 16);
}

function show(cc, value) {
  const label = $("v" + cc);
  if (label) label.textContent = value;
  const bar = $("b" + cc);
  if (bar) bar.style.width = (value / 127 * 100) + "%";
}

// Full browser ranges: beta = pitch -180..180, gamma = roll -90..90, alpha = yaw 0..360 (rotation around the screen axis).
// Yaw is relative to yawOrigin, the first reading after Connect or after a tap on the Yaw row: that direction is CC 64,
// turning right raises it (alpha grows counter-clockwise), and it wraps facing the opposite way.
function onOrientation(e) {
  if (e.beta === null) return;
  const alpha = e.alpha ?? 0;
  if (yawOrigin === null) yawOrigin = alpha;
  current[1] = toCC(e.beta, -180, 180);
  current[2] = toCC(e.gamma, -90, 90);
  current[3] = toCC((yawOrigin - alpha + 540) % 360, 0, 360);
}

function sendChanged() {
  for (const cc of CCS) {
    const v = current[cc];
    if (v === null || v === sent[cc]) continue;
    sent[cc] = v;
    show(cc, v);
    if (midi?.connected) midi.sendControlChange(channel(), cc, v);
  }
}

// CC 4 is the round trip phone -> broker -> phone: 0-500 ms -> 0-127, a ping lost for 1 s -> 127.
const pingTopic = () => `${prefix()}/ping/${name()}`;

function showRtt(ms, text) {
  current[4] = toCC(ms, 0, RTT_MAX_MS);
  $("vnet").textContent = text;
  $("bnet").style.width = (current[4] / 127 * 100) + "%";
}

function ping() {
  if (!midi?.connected) return;
  const now = performance.now();
  if (pingSent !== null && now - pingSent < PING_TIMEOUT_MS) return;
  if (pingSent !== null) showRtt(RTT_MAX_MS, "lost");
  pingSent = now;
  midi.client.publish(pingTopic(), String(now));
}

function onPong(payload) {
  const sentAt = Number(String(payload));
  if (sentAt !== pingSent) return;
  pingSent = null;
  const ms = performance.now() - sentAt;
  showRtt(ms, Math.round(ms) + " ms");
}

async function requestMotion() {
  const DOE = window.DeviceOrientationEvent;
  if (!DOE) return setStatus("no motion sensor", "err");
  if (typeof DOE.requestPermission === "function") {
    const result = await DOE.requestPermission();
    if (result !== "granted") return setStatus("motion denied", "err");
  }
  window.addEventListener("deviceorientation", onOrientation);
}

async function keepAwake() {
  try { await navigator.wakeLock?.request("screen"); } catch {}
}

// Sends notes arriving on {prefix}/out back to {prefix}/in, so the computer can time the round trip.
function listenForEcho() {
  midi.on("noteOn", ({ channel, note, velocity }) => {
    if ($("echo").checked) midi.sendNoteOn(channel, note, velocity);
  });
  midi.on("noteOff", ({ channel, note }) => {
    if ($("echo").checked) midi.sendNoteOff(channel, note);
  });
}

function renderDevices() {
  const list = $("devices");
  list.replaceChildren(list.firstElementChild);
  for (const id of [...online].sort()) {
    const chip = document.createElement("span");
    chip.className = id === name() ? "chip me" : "chip";
    chip.textContent = id;
    list.append(chip);
  }
}

// Uses the underlying MQTT.js client: MqttMidi has no publish options or raw message events,
// and it drops its client on close while MQTT.js keeps reconnecting it.
function wireClient(client) {
  const base = `${prefix()}/status/`;
  const announce = () => client.publish(statusTopic(), "online", STATUS_OPTIONS);
  announce();
  client.on("reconnect", () => setStatus("reconnecting", "busy"));
  client.on("connect", () => {
    if (!midi) return;
    midi.client = client;
    announce();
    setStatus(`${prefix()}/${name()}`, "ok");
  });
  client.subscribe(base + "+");
  client.subscribe(pingTopic());
  client.on("message", (topic, payload) => {
    if (topic === pingTopic()) return onPong(payload);
    if (!topic.startsWith(base)) return;
    const id = topic.slice(base.length);
    if (String(payload) === "online") online.add(id);
    else online.delete(id);
    renderDevices();
  });
}

async function disconnect() {
  if (!midi) return;
  if (midi.connected) midi.client.publish(statusTopic(), "offline", STATUS_OPTIONS);
  await midi.disconnect();
  midi = null;
  online.clear();
  renderDevices();
  pingSent = null;
  $("vnet").textContent = "–";
  setStatus("offline");
  $("connect").textContent = "Connect";
  $("connect").classList.remove("connected");
}

async function connect() {
  if (midi) return disconnect();
  saveSettings();
  // iOS only grants motion permission when asked directly inside the tap handler, before any other await.
  await requestMotion();
  yawOrigin = null;
  setStatus("connecting", "busy");
  midi = new MqttMidi({
    url: $("url").value.trim(),
    prefix: prefix(),
    mqttOptions: {
      username: $("username").value || undefined,
      password: $("password").value || undefined,
      keepalive: 10,
      will: { topic: statusTopic(), payload: "offline", ...STATUS_OPTIONS },
    },
  });
  midi.on("connect", () => setStatus(`${prefix()}/${name()}`, "ok"));
  midi.on("disconnect", () => setStatus("offline"));
  midi.on("error", (err) => setStatus(err.message, "err"));
  listenForEcho();
  try {
    await midi.connect();
    wireClient(midi.client);
    $("connect").textContent = "Disconnect";
    $("connect").classList.add("connected");
    setSetup(false);
    keepAwake();
  } catch (err) {
    midi = null;
    setStatus(err.message, "err");
  }
}

// X -> CC 5 (left 0, right 127), Y -> CC 6 (bottom 0, top 127); values stay after release.
function setXY(e) {
  const rect = $("pad").getBoundingClientRect();
  const x = Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1);
  const y = Math.min(Math.max((e.clientY - rect.top) / rect.height, 0), 1);
  current[5] = Math.round(x * 127);
  current[6] = Math.round((1 - y) * 127);
  $("dot").style.left = x * 100 + "%";
  $("dot").style.top = y * 100 + "%";
  $("xy").textContent = `X ${current[5]} · Y ${current[6]}`;
}

function padDown(e) {
  e.preventDefault();
  $("pad").setPointerCapture(e.pointerId);
  $("pad").classList.add("on", "touched");
  setXY(e);
  navigator.vibrate?.(8);
  if (midi?.connected) midi.sendNoteOn(channel(), 60, 100);
}

function padMove(e) {
  if ($("pad").hasPointerCapture(e.pointerId)) setXY(e);
}

function padUp(e) {
  e.preventDefault();
  if (!$("pad").classList.contains("on")) return;
  $("pad").classList.remove("on");
  if (midi?.connected) midi.sendNoteOff(channel(), 60);
}

function setSetup(open) {
  document.body.classList.toggle("setup", open);
  $("setup-bar").setAttribute("aria-expanded", open);
}

loadSettings();
$("setup-bar").addEventListener("click", () => setSetup(!document.body.classList.contains("setup")));
$("connect").addEventListener("click", connect);
$("pad").addEventListener("pointerdown", padDown);
$("pad").addEventListener("pointermove", padMove);
$("pad").addEventListener("pointerup", padUp);
$("pad").addEventListener("pointercancel", padUp);
$("yaw").addEventListener("click", () => { yawOrigin = null; });
// The whole bar is the touch target: touching sets the value at that position, dragging follows.
function setSlider(e) {
  const rect = $("slider").getBoundingClientRect();
  const t = Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1);
  current[7] = Math.round(t * 127);
  $("slider").style.setProperty("--p", t * 100 + "%");
  $("slider").setAttribute("aria-valuenow", current[7]);
}
$("slider").addEventListener("pointerdown", (e) => {
  $("slider").setPointerCapture(e.pointerId);
  setSlider(e);
});
$("slider").addEventListener("pointermove", (e) => {
  if ($("slider").hasPointerCapture(e.pointerId)) setSlider(e);
});
setInterval(sendChanged, SEND_INTERVAL_MS);
setInterval(ping, PING_INTERVAL_MS);
</script>
</body>
</html>
