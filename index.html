<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mqtt-max</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #f2f2f0; --surface: #ffffff; --ink: #111111; --dim: #8b8b88; --line: #e3e3df; --accent: #ff5a1f;
          --mono: ui-monospace, "SF Mono", Menlo, monospace; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0b0c; --surface: #161618; --ink: #f2f2f2; --dim: #7c7c82; --line: #26262a; }
  }
  body { margin: 0; padding: 48px 16px; background: var(--bg); color: var(--ink);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; }
  main { max-width: 520px; margin: 0 auto; }
  h1 { margin: 0 0 8px; font: 600 15px var(--mono); letter-spacing: 0.04em; }
  h1 i { color: var(--accent); font-style: normal; }
  p { margin: 0 0 32px; color: var(--dim); }
  a.card { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-radius: 16px;
           background: var(--surface); border: 1px solid var(--line); color: inherit; text-decoration: none; }
  a.card:active { opacity: 0.8; }
  .label { font: 500 11px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
  a.card b { display: block; font-weight: 600; margin-bottom: 2px; }
  a.card span:last-child { font: 18px var(--mono); color: var(--dim); }
</style>
</head>
<body>
<main>
  <h1>mqtt<i>·</i>max</h1>
  <p>MIDI and data over MQTT between phones, devices and Max.</p>
  <a class="card" href="phone/">
    <span><b>Phone controller</b><span class="label">Tilt → CC 1–3 · Slider → CC 4 · Pad → Note 60</span></span>
    <span>→</span>
  </a>
</main>
</body>
</html>
